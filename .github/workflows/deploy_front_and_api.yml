name: Build & Deploy Dashboard and API

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: europe-west1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev

      - name: Build dashboard Docker image
        run: docker build -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/dashboard:latest -f dockerfiles/dashboard/Dockerfile .

      - name: Build API Docker image
        run: docker build -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/api:latest -f dockerfiles/api/dockerfile .

      - name: Push dashboard Docker image
        run: docker push $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/dashboard:latest

      - name: Push API Docker image
        run: docker push $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/api:latest
      
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy api \
            --image $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/api:latest \
            --region $GCP_REGION \
            --platform managed \
            --set-env-vars MODEL_STORAGE_BACKEND=gcp \
            --allow-unauthenticated

      - name: Resolve API URL
        id: api-url
        run: |
          API_URL=$(gcloud run services describe api --region $GCP_REGION --format='value(status.url)')
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy dashboard to Cloud Run
        run: |
          gcloud run deploy dashboard \
            --image $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dashboard-repo-mini-ibex-options/dashboard:latest \
            --region $GCP_REGION \
            --platform managed \
            --set-env-vars MODEL_STORAGE_BACKEND=gcp,API_BASE_URL=${{ steps.api-url.outputs.api_url }} \
            --allow-unauthenticated
