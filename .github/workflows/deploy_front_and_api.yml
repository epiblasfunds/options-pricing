name: Build & Deploy Dashboard and API

on:
  workflow_run:
    workflows:
      - Backend GCP Project Terraform Apply
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run_name=${{ github.event.workflow_run.name || 'n/a' }}"
          echo "workflow_run_conclusion=${{ github.event.workflow_run.conclusion || 'n/a' }}"
          echo "workflow_run_head_branch=${{ github.event.workflow_run.head_branch || 'n/a' }}"

      - name: Load cloud config
        run: |
          CONFIG_FILE="resources/cloud_config.json"
          set -euo pipefail

          GCP_REGION="$(jq -r '.gcp.region // empty' "$CONFIG_FILE")"
          PROJECT_ID="$(jq -r '.gcp.project_id // empty' "$CONFIG_FILE")"
          ARTIFACT_REPOSITORY="$(jq -r '.artifact_registry.repository_id // empty' "$CONFIG_FILE")"

          if [[ -z "$GCP_REGION" || -z "$PROJECT_ID" || -z "$ARTIFACT_REPOSITORY" ]]; then
            echo "resources/cloud_config.json is missing required keys: gcp.region, gcp.project_id, artifact_registry.repository_id"
            exit 1
          fi

          echo "GCP_REGION=$GCP_REGION" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "ARTIFACT_REPOSITORY=$ARTIFACT_REPOSITORY" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev

      - name: Build dashboard Docker image
        run: docker build -t $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/dashboard:latest -f dockerfiles/dashboard/Dockerfile .

      - name: Build API Docker image
        run: docker build -t $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/api:latest -f dockerfiles/api/Dockerfile .

      - name: Push dashboard Docker image
        run: docker push $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/dashboard:latest

      - name: Push API Docker image
        run: docker push $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/api:latest
      
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy api \
            --image $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/api:latest \
            --region $GCP_REGION \
            --platform managed \
            --set-env-vars MODEL_STORAGE_BACKEND=gcp \
            --allow-unauthenticated

      - name: Get Cloud Run API Service URL
        id: api-url
        run: |
          API_URL=$(gcloud run services describe api --region $GCP_REGION --format='value(status.url)')
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy dashboard to Cloud Run
        run: |
          gcloud run deploy dashboard \
            --image $GCP_REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/dashboard:latest \
            --region $GCP_REGION \
            --platform managed \
            --set-env-vars MODEL_STORAGE_BACKEND=gcp,API_BASE_URL=${{ steps.api-url.outputs.api_url }} \
            --allow-unauthenticated
