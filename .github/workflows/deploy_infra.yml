name: Backend GCP project Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Backend GCP project Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure GCP credentials
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      # - name: Make script executable
      #   run: chmod +x ./scripts/gcp/bootstrap_gcs.sh

      # - name: Create Terraform Backend
      #   run: ./scripts/gcp/bootstrap_gcs.sh

      - name: Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false

      - name: Terraform Plan
        run: terraform -chdir=$TF_WORKING_DIR plan -out=tfplan_gcp

      - name: Terraform Apply
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan_gcp

      - name: Get bucket name from Terraform
        run: echo "BUCKET_NAME=$(terraform -chdir=$TF_WORKING_DIR output -raw models_bucket_name)" >> $GITHUB_ENV

      - name: Upload trained_metadata to GCS
        run: gsutil -m cp -r src/volatility_models/trained_metadata gs://$BUCKET_NAME/

      - name: Upload trained_models to GCS
        run: gsutil -m cp -r src/volatility_models/trained_models gs://$BUCKET_NAME/

