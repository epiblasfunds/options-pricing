name: Backend GCP project Terraform Apply

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Backend GCP project Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./terraform
      TF_BACKEND_BUCKET: "options-pricing-explainability-tfstate"
      TF_VAR_gcp_project: "options-pricing-explainability"
      TF_VAR_volatility_models_bucket: "options-pricing-explainability-volatility"
      TF_VAR_dashboard_models_bucket: "options-pricing-explainability-dashboard"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Make script executable
        run: chmod +x ./scripts/bootstrap_gcp.sh

      - name: Create Terraform Backend
        run: ./scripts/bootstrap_gcp.sh

      - name: Terraform Init
        run: |
          terraform -chdir=$TF_WORKING_DIR init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="prefix=terraform/state" \
            -input=false

      - name: Terraform Plan
        run: terraform -chdir=$TF_WORKING_DIR plan -input=false -out=tfplan_gcp

      - name: Terraform Apply
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan_gcp

      - name: Get volatility bucket name from Terraform
        run: echo "VOLATILITY_BUCKET=$(terraform -chdir=$TF_WORKING_DIR output -raw volatility_models_bucket_name)" >> $GITHUB_ENV

      - name: Get dashboard bucket name from Terraform
        run: echo "DASHBOARD_BUCKET=$(terraform -chdir=$TF_WORKING_DIR output -raw dashboard_models_bucket_name)" >> $GITHUB_ENV

      - name: Upload trained_metadata to GCS
        run: |
          if [ -d src/volatility_models/trained_metadata ]; then
            gsutil -m cp -r src/volatility_models/trained_metadata gs://$BUCKET_NAME/
          else
            echo "trained_metadata folder does not exist, skipping upload."
          fi

      - name: Upload trained_models to volatility bucket
        run: |
          if [ -d src/volatility_models/trained_models ]; then
            gsutil -m cp -r src/volatility_models/trained_models gs://$VOLATILITY_BUCKET/
          else
            echo "trained_models folder does not exist, skipping upload."
          fi

      - name: Upload dashboard saved_models to dashboard bucket
        run: |
          if [ -d src/dashboard/saved_models ]; then
            gsutil -m cp -r src/dashboard/saved_models gs://$DASHBOARD_BUCKET/
          else
            echo "saved_models folder does not exist, skipping upload."
          fi

