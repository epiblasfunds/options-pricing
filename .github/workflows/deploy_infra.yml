name: Backend GCP project Terraform Apply

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Backend GCP project Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./terraform
      TF_VAR_gcp_project: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load cloud config
        run: |
          CONFIG_FILE="resources/cloud_config.json"
          echo "TF_BACKEND_BUCKET=$(jq -r '.terraform.backend_bucket' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"
          echo "TF_VAR_gcp_project=$(jq -r '.gcp.project_id' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"
          echo "TF_VAR_gcp_region=$(jq -r '.gcp.region' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"
          echo "TF_VAR_volatility_models_bucket=$(jq -r '.storage.volatility_models_bucket' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"
          echo "TF_VAR_explainability_artifacts_bucket=$(jq -r '.storage.explainability_artifacts_bucket' "$CONFIG_FILE")" >> "$GITHUB_ENV"
          echo "TF_VAR_artifact_repository_id=$(jq -r '.artifact_registry.repository_id' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"
          echo "TF_VAR_github_actions_service_account_email=$(jq -r '.gcp.service_account_email' \"$CONFIG_FILE\")" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.TF_VAR_gcp_project }}

      - name: Make bootstrap script executable
        run: chmod +x ./scripts/bootstrap_gcp.sh

      - name: Prepare Terraform Remote State Backend (GCS)
        run: ./scripts/bootstrap_gcp.sh

      - name: Terraform Init
        run: |
          terraform -chdir=$TF_WORKING_DIR init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="prefix=terraform/state" \
            -input=false

      - name: Terraform Plan
        run: terraform -chdir=$TF_WORKING_DIR plan -input=false -out=tfplan_gcp

      - name: Terraform Apply
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan_gcp
