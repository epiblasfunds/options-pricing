site_name: Volatilidad explicable en opciones del IBEX
site_description: Documentación técnica del proyecto de modelado de volatilidad implícita y explicabilidad.
site_author: Proyecto TFM
docs_dir: docs
site_dir: site
theme:
  name: readthedocs
  locale: es
  navigation_depth: 2
  collapse_navigation: true
  sticky_navigation: true
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom
nav:
  - Inicio: index.md
  - Estructura del repositorio:
      - Visión general: repository/index.md
      - Configuración y resources: repository/configuration.md
      - Paquetes de src: repository/src-packages.md
  - Datos:
      - Visión general del ETL: data/index.md
      - Lectura raw: data/raw-read.md
      - Unión de mercado y contratos: data/merge-raw.md
      - Separación por producto: data/product-split.md
      - Subyacente de cada opción: data/underlying.md
      - Volatilidad implícita: data/volatility.md
  - Modelos de volatilidad:
      - Visión general: models/index.md
      - Diseño de variables:
          - Características financieras: models/features.md
      - Validación y selección:
          - Splits temporales y k-folds: models/splits-kfolds.md
          - Entrenamiento y selección: models/training.md
          - Reentrenamiento y progressive training: models/retraining-progressive.md
      - Familias de modelos:
          - Comparativa de familias: models/families.md
          - Regresión lineal: models/families/linear-regression.md
          - Random Forest: models/families/random-forest.md
          - XGBoost: models/families/xgboost.md
          - Redes neuronales: models/families/neural-networks.md
          - Quantum Inspired: models/families/quantum-inspired.md
  - Dashboard:
      - Cometido del dashboard: dashboard/index.md
      - Generación de artefactos:
          - De modelo entrenado a bundle visualizable: dashboard/model-to-dashboard.md
      - Explicabilidad global:
          - Mapa de la pestaña: dashboard/global-explainability.md
          - Fundamentos de SHAP: dashboard/global/shap-fundamentals.md
          - Visualizaciones SHAP: dashboard/global/shap-visualizations.md
          - Árboles surrogate: dashboard/global/surrogate-trees.md
          - Regresión simbólica: dashboard/global/symbolic-regression.md
      - Superficies y respuesta:
          - Mapa de la pestaña: dashboard/behaviour-surface.md
          - Superficies de volatilidad: dashboard/behaviour/volatility-surfaces.md
          - Curvas ICE: dashboard/behaviour/ice.md
          - Curvas ALE: dashboard/behaviour/ale.md
      - Explicabilidad local:
          - Mapa de la pestaña: dashboard/sample-explainability.md
          - SHAP local y waterfall: dashboard/sample/local-shap-waterfall.md
          - Vecinos y soporte local: dashboard/sample/neighbours.md
      - Diagnóstico:
          - Diagnóstico de rendimiento: dashboard/diagnosis.md
  - Operación:
      - API, almacenamiento y despliegue: operations/api-deployment.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/nav-labels.js



